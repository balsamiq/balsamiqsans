name: Build font and specimen

on:
  push:
    # Branches only: a release's tag push would duplicate the release build below
    branches: ["**"]
  release:
    # Only a newly published release builds and uploads the fonts. Other release
    # activity (edits, deletions) would rerun the upload, or fail on a deleted release.
    types: [published]

# Read-only by default. Only the release job gets write access, so the build
# (and the Python packages it installs) never holds a write-scoped token.
permissions:
  contents: read

env:
  # The archive name, e.g. "balsamiqsans-fonts"
  ZIP_NAME: ${{ github.event.repository.name }}-fonts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install sys tools/deps
        run: |
          sudo apt-get update
          sudo apt-get install ttfautohint libcairo2-dev
          sudo snap install yq
      - name: Read runner image
        id: runner-image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # The venv points to the interpreter it was built with, so the key includes the
      # OS release (e.g. ubuntu24) and the full Python version. There are no
      # restore-keys: a partial match would bring back packages that requirements.txt
      # no longer lists.
      - uses: actions/cache@v6
        id: venv-cache
        with:
          path: ./venv/
          key: ${{ steps.runner-image.outputs.os }}-python-${{ steps.setup-python.outputs.python-version }}-venv-${{ hashFiles('**/requirements*.txt') }}
      # The restored touchfile is older than the freshly checked out requirements.txt,
      # so make would reinstall everything. An exact cache hit is already up to date
      # (a cache is only saved after a successful run).
      - name: Mark the restored venv as current
        if: steps.venv-cache.outputs.cache-hit == 'true'
        run: touch venv/touchfile
      # If a new release is cut, use the release tag to auto-bump the source files
      - name: Bump release
        if: github.event_name == 'release'
        run: |
          make venv
          . venv/bin/activate
          SRCS=$(yq e ".sources[]" sources/config.yaml)
          echo "Bumping $SRCS to $GITHUB_REF_NAME"
          for src in $SRCS
          do
            bumpfontversion "sources/$src" --new-version "$GITHUB_REF_NAME";
          done
      - name: Build font
        run: make build
      - name: Check with fontbakery
        run: make test
        continue-on-error: true
      - name: proof
        run: make proof
      - name: setup site
        run: cp scripts/index.html out/index.html
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            fonts
            out
  release:
    # only run if the commit is tagged...
    if: github.event_name == 'release'
    # ... and it builds successfully
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artefact files
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
      - name: Zip files
        run: zip -r ${{ env.ZIP_NAME }}.zip ${{ env.ZIP_NAME }}
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ZIP_NAME }}.zip
          asset_name: ${{ env.ZIP_NAME }}.zip
          tag: ${{ github.ref }}
          overwrite: true
          body: "Production ready fonts"
