sources:
  - glyphs/BalsamiqSans-Roman.glyphs
  - glyphs/BalsamiqSans-Italic.glyphs
axisOrder:
  - wght
  - ital
familyName: Balsamiq Sans

# Sources aren't VF compatible
buildVariable: false
checkCompatibility: false

# The sources are drawn counter-clockwise (PostScript direction). TrueType
# wants clockwise outer contours, so reverse them for the TTFs (fontmake
# leaves the OTFs alone).
reverseOutlineDirection: true
removeOutlineOverlaps: false

# Hit the needed code paths to insert the right metadata into the sources before
# they hit the compiler.
interpolate: true
buildOTF: true
buildWebfont: true

autohintTTF: true